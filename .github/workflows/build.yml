name: Build

on:
  push:
    branches: [ "main" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      ghidra_version:
        description: "Ghidra release to build against (e.g. 12.1.3)"
        required: false
        default: "12.1.3"

permissions:
  contents: write  # publish GitHub Releases for tags

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GHIDRA_VERSION: ${{ github.event.inputs.ghidra_version || '12.1.3' }}

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Download Ghidra
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release download "Ghidra_${GHIDRA_VERSION}_build" \
          --repo NationalSecurityAgency/ghidra --pattern "ghidra_${GHIDRA_VERSION}_PUBLIC_*.zip" \
          --output ghidra.zip
        unzip -q ghidra.zip -d "${RUNNER_TEMP}/ghidra"
        echo "GHIDRA_HOME=$(echo "${RUNNER_TEMP}"/ghidra/ghidra_*_PUBLIC)" >> "${GITHUB_ENV}"

    - name: Build and test
      run: ./build.sh -B

    - name: Name the package
      run: |
        version="${GITHUB_REF_NAME//\//-}"
        [[ "${GITHUB_REF_TYPE}" == tag ]] || version="$(git rev-parse --short HEAD)"
        package="GhidraMCP-${version}-ghidra${GHIDRA_VERSION}.zip"
        cp target/GhidraMCP-*.zip "${package}"
        echo "PACKAGE=${package}" >> "${GITHUB_ENV}"

    - name: Upload extension
      uses: actions/upload-artifact@v7
      with:
        name: GhidraMCP-ghidra${{ env.GHIDRA_VERSION }}
        path: ${{ env.PACKAGE }}

    - name: Publish release
      if: github.ref_type == 'tag'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
          gh release upload "${GITHUB_REF_NAME}" "${PACKAGE}" --clobber
        else
          gh release create "${GITHUB_REF_NAME}" "${PACKAGE}" \
            --title "GhidraMCP ${GITHUB_REF_NAME}" --generate-notes
        fi
