name: Build

on:
  push:
    branches: [ "main" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      ghidra_version:
        description: "Ghidra release to build against (e.g. 12.1.3)"
        required: false
        default: "12.1.3"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GHIDRA_VERSION: ${{ github.event.inputs.ghidra_version || '12.1.3' }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Download Ghidra
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release download "Ghidra_${GHIDRA_VERSION}_build" \
          --repo NationalSecurityAgency/ghidra --pattern "ghidra_${GHIDRA_VERSION}_PUBLIC_*.zip" \
          --output ghidra.zip
        unzip -q ghidra.zip -d "${RUNNER_TEMP}/ghidra"
        echo "GHIDRA_HOME=$(echo "${RUNNER_TEMP}"/ghidra/ghidra_*_PUBLIC)" >> "${GITHUB_ENV}"

    - name: Build and test
      run: ./build.sh -B

    - name: Upload extension
      uses: actions/upload-artifact@v4
      with:
        name: GhidraMCP-ghidra${{ env.GHIDRA_VERSION }}
        path: target/GhidraMCP-*.zip
